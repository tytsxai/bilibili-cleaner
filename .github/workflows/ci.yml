name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term

      # v5 still pins actions/github-script@v7 internally, which the runner
      # force-migrates off Node 20 with a deprecation warning on every run.
      # v6 moved that to github-script@v8 (Node 24); v7 is that plus a
      # re-issued GPG key. Inputs below are unchanged across all three.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # The Web UI has no build step, so nothing else would catch a broken id
  # contract, an unbalanced tag, or a typo'd CSS variable before runtime.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check app.js syntax
        run: node --check frontend/app.js
      - name: Check markup, id contract, icons and CSS variables
        run: python scripts/check_frontend.py

  # The pinned set is what actually ships in the image. Resolving it separately
  # catches a constraints.txt that has drifted out of sync with requirements.
  pinned-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install -r backend/requirements.txt -c constraints.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests against pinned versions
        run: pytest tests/ -q

  # Nothing else exercises the Dockerfile, so a broken build would otherwise
  # only surface at deploy time.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t bilibili-cleaner:ci .
      - name: Start container
        run: docker run -d --name cleaner -p 8000:8000 bilibili-cleaner:ci
      - name: Wait for health endpoint
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy" >&2
          docker logs cleaner >&2
          exit 1
      - name: Check readiness and static UI
        run: |
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS -o /dev/null http://127.0.0.1:8000/
      - name: Verify the container does not run as root
        run: test "$(docker exec cleaner id -u)" != "0"
      - name: Container logs
        if: always()
        run: docker logs cleaner
