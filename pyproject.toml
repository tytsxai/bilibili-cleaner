[project]
name = "bilibili-cleaner"
version = "1.2.0"
description = "Self-hosted toolkit to inspect and clean a Bilibili account. Ships an HTTP API (FastAPI) and a CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tytsxai" }]
keywords = ["bilibili", "cleaner", "unfollow", "cli", "fastapi"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "qrcode>=7.4.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "typer>=0.12.0",
    "pydantic>=2.0",
]

[project.scripts]
bilibili-cleaner = "backend.cli.main:app"

[project.urls]
Homepage = "https://github.com/tytsxai/bilibili-cleaner"
Issues = "https://github.com/tytsxai/bilibili-cleaner/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
