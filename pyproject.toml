[project]
name = "bilibili-cleaner"
version = "1.2.0"
description = "Open-source self-hosted Bilibili account cleaner with FastAPI HTTP API, Web UI, CLI, OpenAPI schema, rate limiting, and async cleanup tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tytsxai" }]
keywords = [
    "bilibili",
    "bilibili-cleaner",
    "account-cleanup",
    "bilibili-api",
    "bilibili-cli",
    "bulk-unfollow",
    "data-cleanup",
    "dynamic-delete",
    "favorites-cleanup",
    "watch-history",
    "self-hosted",
    "privacy-tool",
    "openapi",
    "ai-agent",
    "cli",
    "typer-cli",
    "fastapi",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "qrcode>=7.4.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "typer>=0.12.0",
    "pydantic>=2.0",
]

[project.scripts]
bilibili-cleaner = "backend.cli.main:app"

[project.urls]
Homepage = "https://github.com/tytsxai/bilibili-cleaner"
Repository = "https://github.com/tytsxai/bilibili-cleaner"
Documentation = "https://github.com/tytsxai/bilibili-cleaner#readme"
Changelog = "https://github.com/tytsxai/bilibili-cleaner/blob/main/CHANGELOG.md"
Issues = "https://github.com/tytsxai/bilibili-cleaner/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
